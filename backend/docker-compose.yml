# PostgreSQL local para desarrollo y pruebas (mismo motor que Neon).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: evaluacion
      POSTGRES_PASSWORD: evaluacion
      POSTGRES_DB: evaluacion
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
